# Vaqtinchalik diagnostika: production sxemasining TUZILISHI (ma'lumotsiz) — migratsiyani moslash uchun.
# run: 4
name: DB schema snapshot
on:
  push:
    branches: [release/3.1.0]
    paths: [.github/workflows/db-schema.yml]
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Sxema (pg_dump --schema-only)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null 2>&1
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          mkdir out
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -At -c "select version()" > out/version.txt
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --schema-only --no-owner -n public > out/public.sql
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -At -c "SELECT schemaname, tablename, policyname, cmd, roles::text, qual, with_check FROM pg_policies WHERE schemaname='storage'" > out/storage_policies.txt
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -At -c "SELECT tgname, tgrelid::regclass, pg_get_triggerdef(oid) FROM pg_trigger WHERE tgrelid='auth.users'::regclass AND NOT tgisinternal" > out/auth_triggers.txt
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -At -c "SELECT jobid, schedule, jobname, left(command,300) FROM cron.job" > out/cron.txt 2>&1 || true
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL" -At -c "SELECT role, count(*) FROM public.user_roles GROUP BY 1" > out/roles.txt 2>&1 || true
          for f in out/*; do echo "=====FILE $f"; cat "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: schema
          path: out/
          retention-days: 1
